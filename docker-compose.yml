version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: ats-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ats-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped